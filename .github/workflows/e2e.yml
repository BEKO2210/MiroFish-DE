name: E2E (Playwright)

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Gleiches Image wie e2e/docker-test.sh lokal: identische Browser und Schriften für den Pixelvergleich
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Run E2E suite
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/webkit-status.txt
            e2e/BEFUNDE.md
          retention-days: 14
